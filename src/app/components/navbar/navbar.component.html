<header class="sticky top-0 z-40 border-b border-ink/10 bg-sleeve/90 backdrop-blur">
  <div class="mx-auto flex h-16 max-w-6xl items-center gap-4 px-4 sm:gap-8 sm:px-6">
    <a routerLink="/pokemon" class="shrink-0" aria-label="Pokédex home">
      <img src="pokemon-logo-png-1428.png" alt="Pokémon" class="h-7 w-auto sm:h-9" />
    </a>

    <nav class="flex flex-1 items-center gap-1 sm:gap-2" aria-label="Main">
      <a routerLink="/pokemon" routerLinkActive="is-active" class="nav-link">Pokédex</a>
      <a routerLink="/form-submission" routerLinkActive="is-active" class="nav-link">Orders</a>
      <a routerLink="/cart" routerLinkActive="is-active" class="nav-link" data-cart-target>
        Cart
        <span
          *ngIf="(cartItemCount$ | async) as count"
          class="ml-1 inline-block rounded-full bg-ink px-1.5 text-xs font-bold text-paper"
          [class.badge-bump]="bump"
          [attr.aria-label]="count + (count === 1 ? ' card' : ' cards')">
          {{ count }}
        </span>
      </a>
    </nav>

    <span *ngIf="userEmail$ | async as email" class="hidden max-w-[16rem] truncate text-sm text-ink/60 md:block" [title]="email">
      {{ email }}
    </span>
    <button type="button" class="nav-link" (click)="logout()" aria-label="Log out">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
      <span class="hidden sm:inline">Log out</span>
    </button>
  </div>
</header>
